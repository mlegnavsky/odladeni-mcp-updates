name: Diagnose Odladeni FTPS certificate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect FTPS certificate without login or file changes
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          python3 - <<'PY'
          import os, socket, ssl, tempfile, subprocess
          host=os.environ.get("FTP_HOST","").strip()
          if not host or any(c in host for c in "/:@ "):
              raise SystemExit("FTP_HOST must be a hostname or IP only")
          print("Checking explicit FTPS certificate on port 21")
          with socket.create_connection((host,21),timeout=15) as raw:
              greeting=raw.recv(2048)
              if not greeting.startswith(b"220"):
                  raise RuntimeError("Unexpected FTP greeting")
              raw.sendall(b"AUTH TLS\r\n")
              response=raw.recv(2048)
              if not response.startswith(b"234"):
                  raise RuntimeError("FTP server did not accept AUTH TLS")
              with ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT).wrap_socket(raw,server_hostname=host,do_handshake_on_connect=False) as tls:
                  tls.context.check_hostname=False
                  tls.context.verify_mode=ssl.CERT_NONE
                  tls.do_handshake()
                  der=tls.getpeercert(binary_form=True)
          if not der: raise RuntimeError("Server sent no certificate")
          with tempfile.NamedTemporaryFile(suffix=".der") as f:
              f.write(der);f.flush()
              result=subprocess.run(["openssl","x509","-inform","DER","-in",f.name,"-noout","-subject","-issuer","-dates","-ext","subjectAltName"],capture_output=True,text=True,check=True)
              print(result.stdout)
          print("Certificate inspected only; no FTP login, no files read or modified.")
          print("Do not disable TLS certificate verification for deployment.")
          PY
