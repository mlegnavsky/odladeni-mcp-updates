name: Test Odladeni FTPS connection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-ftps:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check explicit FTPS login (read-only)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, ssl, ftplib
          host=os.environ["FTP_HOST"].strip()
          user=os.environ["FTP_USER"]
          password=os.environ["FTP_PASSWORD"]
          if not all((host,user,password)):
              raise SystemExit("Missing GitHub FTP secrets")
          if any(c in host for c in "/:@ "):
              raise SystemExit("FTP_HOST must be hostname or IP only")
          tls=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=15)
          try:
              tls.connect(host,21)
              tls.auth()
              tls.login(user,password)
              tls.prot_p()
              print("FTPS login successful (TLS encrypted).")
              print("Remote working directory:",tls.pwd())
              print("Read-only test finished. No files modified.")
          finally:
              try: tls.quit()
              except Exception: tls.close()
          PY
